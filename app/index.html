<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Region Tracker</title>
    <meta name="description" content="Mark the cities you’ve visited and watch your regions and countries fill in on the map." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231f7a6d'/%3E%3Cpath d='M9 17c3-6 9-8 14-5' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#map">Skip to map</a>
    <header class="topbar">
      <div class="brand" aria-label="Region Tracker">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="currentColor"/><path d="M9 17c3-6 9-8 14-5" stroke="var(--color-surface)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
        <span>Region Tracker</span>
      </div>
      <!-- Phase 2: city search goes here -->
      <div id="projection-toggle" class="segmented"></div>
    </header>

    <main>
      <div id="map" class="map" role="application" aria-label="World map"></div>
      <div id="tooltip" class="tooltip" hidden aria-hidden="true"></div>
      <section id="region-card" class="card" aria-live="polite"></section>
      <div id="notices" class="notices"></div>
    </main>

    <noscript><p class="map-fallback">Region Tracker needs JavaScript to show the map.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
